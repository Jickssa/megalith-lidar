name: Validate and build Monolith France

on:
  pull_request:
    paths:
      - "integrations/monolith-france/**"
      - "android/**"
      - "scripts/prepare_android_assets.py"
      - "index.html"
      - ".github/workflows/validate-monolith-france.yml"
  push:
    branches:
      - "feature/monolith-france-1.1.0"
      - "feature/monolith-international-next"
    paths:
      - "integrations/monolith-france/**"
      - "android/**"
      - "scripts/prepare_android_assets.py"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation and installer regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Validate package
        run: python integrations/monolith-france/scripts/validate_package.py
      - name: JavaScript syntax
        run: node --check integrations/monolith-france/web/app.js
      - name: Web logic regression tests
        run: node integrations/monolith-france/scripts/test_web_logic.js
      - name: Python syntax
        run: python -m py_compile integrations/monolith-france/scripts/*.py
      - name: Installer regression fixture
        run: python integrations/monolith-france/scripts/test_android_installer.py

  android-debug-build:
    name: Android Debug APK build
    runs-on: ubuntu-latest
    needs: static-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_MANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_MANAGER" --licenses >/dev/null
          "$ANDROID_SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Python validation dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Install France module into Android project
        run: python integrations/monolith-france/scripts/install_into_megalith_lidar_android.py "$GITHUB_WORKSPACE" --force
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee gradle-build.log
      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monolith-france-gradle-diagnostics
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify APK contents, alignment and signature
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          python - "$APK" <<'PY'
          from zipfile import ZipFile
          import sys
          apk = sys.argv[1]
          required = (
              "assets/web/france/web/index.html",
              "assets/web/france/web/app.js",
              "assets/web/france/config/france-config.json",
              "assets/web/france/config/archaeology-taxonomy.fr.json",
              "assets/web/france/config/data-sources.json",
              "assets/web/atlas-home.html",
              "assets/web/uk-home.html",
              "assets/web/france-home.html",
              "assets/web/leaflet/leaflet.js",
              "assets/web/leaflet/leaflet.css",
              "assets/web/index.html",
          )
          with ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"APK ZIP CRC failure: {bad}")
              names = set(z.namelist())
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("APK assets missing:\n" + "\n".join(missing))
              with z.open("assets/web/france/web/app.js") as f:
                  app_js = f.read().decode("utf-8")
              with z.open("assets/web/france/web/index.html") as f:
                  app_html = f.read().decode("utf-8")
              if "buildOverpassQuery" not in app_js or "archaeologyCategory" not in app_html:
                  raise SystemExit("APK French archaeological search assets are incomplete")
          print("APK archive integrity, international routes and France search: OK")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/megalith-lidar-france-debug.apk
          (cd dist && sha256sum megalith-lidar-france-debug.apk > megalith-lidar-france-debug.apk.sha256)
          cat dist/megalith-lidar-france-debug.apk.sha256
      - name: Upload Debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: megalith-lidar-france-debug
          path: |
            dist/megalith-lidar-france-debug.apk
            dist/megalith-lidar-france-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
