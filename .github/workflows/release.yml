name: Android Release Candidate

on:
  push:
    branches:
      - feature/monolith-international-next
    paths:
      - ".github/workflows/release.yml"
      - "android/**"
      - "index.html"
      - "docs/candidates.geojson"
      - "docs/roman_candidates.geojson"
      - "docs/enclosure_candidates.geojson"
      - "docs/survey_summary.json"
      - "scripts/prepare_android_assets.py"
      - "scripts/export_osmand_plugin.py"
      - "scripts/check-r8-kept-classes.sh"
      - "integrations/monolith-france/scripts/**"
      - "integrations/monolith-france/web/**"
      - "integrations/monolith-france/config/**"
      - "fastlane/metadata/android/en-US/changelogs/**"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact branch or commit to validate (must be the International branch)"
        required: true
        default: "feature/monolith-international-next"
      tag:
        description: "Release tag (must match versionName); never replace an existing tag"
        required: true
        default: "v3.3.0"
      mode:
        description: "Build unsigned candidate, sign an installable test APK without publishing, or publish a signed public release"
        type: choice
        required: true
        default: "build-only"
        options:
          - build-only
          - signed-test
          - publish
      confirm_publication:
        description: "For publish only, enter exactly PUBLISH_PUBLIC_RELEASE to authorize creating the public tag and release"
        required: false
        type: string


permissions:
  contents: read

jobs:
  build-release-candidate:
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      historical_cert_sha256: ${{ steps.historical-cert.outputs.sha256 }}
    name: Build and inspect unsigned release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate inputs and reject existing tags
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
          RELEASE_TAG: ${{ inputs.tag || 'v3.3.0' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "feature/monolith-international-next" ]] || { echo "source_ref must be feature/monolith-international-next"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag format"; exit 1; }

      - name: Checkout exact selected source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !docs/Uk_roman_roads_2.obf
            !docs/megalith-lidar.osf
          sparse-checkout-cone-mode: false

      - name: Record source identity and enforce version/tag consistency
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v3.3.0' }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          set +e
          REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" 2>&1)"
          TAG_STATUS=$?
          set -e
          if [[ "$TAG_STATUS" -ne 0 ]]; then
            echo "Could not establish tag availability (git ls-remote exit $TAG_STATUS)"
            exit 1
          fi
          if [[ -n "$REMOTE_TAGS" ]]; then
            echo "Refusing existing tag: $RELEASE_TAG"
            exit 1
          fi
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' android/app/build.gradle.kts | head -n1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' android/app/build.gradle.kts | head -n1)"
          [[ "$RELEASE_TAG" == "v${VERSION_NAME}" ]] || { echo "Tag/versionName mismatch: $RELEASE_TAG vs $VERSION_NAME"; exit 1; }
          [[ -n "$VERSION_CODE" && "$VERSION_CODE" -gt 320 ]] || { echo "versionCode must be greater than 320"; exit 1; }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$RELEASE_TAG (not created)" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION_NAME ($VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
          test -s "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt" || { echo "Missing Fastlane changelog for versionCode ${VERSION_CODE}"; exit 1; }

      - name: Verify version and native startup route before build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts').read_text(encoding='utf-8')
          activity = Path('android/app/src/main/java/uk/megalith/lidar/MainActivity.kt').read_text(encoding='utf-8')
          start = re.search(r'private\s+const\s+val\s+START_URL\s*=\s*"([^"]+)"', activity)
          if not start or not start.group(1).endswith('/assets/web/atlas-home.html'):
              raise SystemExit('MainActivity must start at the International atlas selector')
          code = re.search(r'\bversionCode\s*=\s*(\d+)', gradle)
          name = re.search(r'\bversionName\s*=\s*"([^"]+)"', gradle)
          if not code or int(code.group(1)) != 321: raise SystemExit('versionCode must be 321')
          if not name or name.group(1) != '3.3.0': raise SystemExit('versionName must be 3.3.0')
          print('Version and native selector route: OK')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK Platform 35 & Build-Tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify official upstream v3.2.0 signer certificate
        id: historical-cert
        run: |
          set -euo pipefail
          OFFICIAL_APK="$RUNNER_TEMP/megalith-lidar-v3.2.0.apk"
          OFFICIAL_URL="https://github.com/GlassOnTin/megalith-lidar/releases/download/v3.2.0/megalith-lidar-v3.2.0.apk"
          curl --fail --location --retry 3 --retry-all-errors "$OFFICIAL_URL" --output "$OFFICIAL_APK"
          echo "cf6362d6c5513c08740f2b0f58ac3178f29b11f0584117a2b3bd2911d6bdd3dd  $OFFICIAL_APK" | sha256sum --check --status
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          BADGING="$("${BUILD_TOOLS}/aapt" dump badging "$OFFICIAL_APK")"
          grep -Fq "package: name='uk.megalith.lidar' versionCode='320' versionName='3.2.0'" <<< "$BADGING" || { echo "Official upstream APK package/version does not match the historic target"; exit 1; }
          VERIFY_OUTPUT="$("${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$OFFICIAL_APK" 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -q 'Number of signers: 1' || { echo "Official upstream APK does not have exactly one signer"; exit 1; }
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -nE 's/.*Signer #1 certificate SHA-256 digest: ([A-Fa-f0-9:]+).*/\1/p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ "$CERT_SHA256" =~ ^[A-F0-9]{64}$ ]] || { echo "Could not extract official upstream certificate SHA-256"; exit 1; }
          echo "sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Historical official signer SHA-256: $CERT_SHA256"
          echo "Historical official signer SHA-256: $CERT_SHA256" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$OFFICIAL_APK"


      - name: Install Python build dependency
        run: python3 -m pip install --disable-pip-version-check "Pillow>=10,<13"

      - name: Install France and International assets into Android project
        run: python3 integrations/monolith-france/scripts/install_into_megalith_lidar_android.py "$GITHUB_WORKSPACE" --force

      - name: Build release APK with R8
        working-directory: android
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          ./gradlew assembleRelease -PnoLintVital --no-daemon --stacktrace

      - name: Check R8 retained classes
        run: ./scripts/check-r8-kept-classes.sh

      - name: Verify APK contents and archive integrity
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          python3 - "$APK" <<'PY'
          from zipfile import ZipFile
          import sys
          required = (
              "assets/web/atlas-home.html",
              "assets/web/community-countries.html",
              "assets/web/france-home.html",
              "assets/web/uk-home.html",
              "assets/web/index.html",
              "assets/web/france/web/index.html",
              "assets/web/france/web/app.js",
              "assets/web/france/web/styles.css",
              "assets/web/france/config/countries/catalog.json",
              "assets/web/france/config/countries/profiles/FR.json",
              "assets/web/france/config/countries/profiles/GB.json",
              "assets/web/france/config/languages/fr-FR.json",
              "assets/web/france/config/languages/en-GB.json",
              "assets/web/leaflet/leaflet.js",
              "assets/web/leaflet/leaflet.css",
              "assets/web/docs/candidates.geojson",
              "assets/web/docs/roman_candidates.geojson",
              "assets/web/docs/enclosure_candidates.geojson",
              "assets/web/docs/survey_summary.json",
              "assets/web/docs/uk_counties.geojson",
              "assets/web/docs/roman_and_ancient_roads.geojson",
              "assets/web/docs/community_annotations.json",
              "assets/web/docs/roman_summary.json",
              "assets/web/docs/enclosure_summary.json",
              "assets/web/docs/josm_os1888_antiquities.osm",
              "assets/web/docs/maproulette_os1888_antiquities.geojson",
              "assets/web/docs/megalith-lidar.osf",
              "assets/web/docs/megalith_lidar_osmand.gpx",
              "assets/web/docs/osmand_qr.svg",
              "assets/web/docs/uk_roman_roads.addon.render.xml",
              "assets/web/leaflet/images/layers.png",
              "assets/web/leaflet/images/layers-2x.png",
              "assets/web/leaflet/images/marker-icon.png",
              "assets/web/leaflet/images/marker-icon-2x.png",
              "assets/web/leaflet/images/marker-shadow.png",
              "assets/web/france/web/vendor/images/layers.png",
              "assets/web/france/web/vendor/images/layers-2x.png",
              "assets/web/france/web/vendor/images/marker-icon.png",
              "assets/web/france/web/vendor/images/marker-icon-2x.png",
              "assets/web/france/web/vendor/images/marker-shadow.png",
          )
          with ZipFile(sys.argv[1]) as apk:
              bad = apk.testzip()
              if bad: raise SystemExit(f"ZIP CRC failure: {bad}")
              names = set(apk.namelist())
              missing = [name for name in required if name not in names]
              if missing: raise SystemExit("APK assets missing:\n" + "\n".join(missing))
              chooser = apk.read("assets/web/atlas-home.html").decode("utf-8")
              expected_routes = (
                  "FR:'/assets/web/france/web/index.html'",
                  "GB:'/assets/web/index.html'",
              )
              for route in expected_routes:
                  if route not in chooser: raise SystemExit(f"Selector route missing: {route}")
              fr_profile = apk.read("assets/web/france/config/countries/profiles/FR.json").decode("utf-8")
              gb_profile = apk.read("assets/web/france/config/countries/profiles/GB.json").decode("utf-8")
              if '"aiDetection": false' not in fr_profile: raise SystemExit("France AI must remain disabled")
              if '"atlasEntry": "/assets/web/index.html"' not in gb_profile: raise SystemExit("GB profile route mismatch")
              dex = [name for name in names if name.startswith("classes") and name.endswith(".dex")]
              if not dex: raise SystemExit("No DEX bytecode found")
              data = b"".join(apk.read(name) for name in dex)
              if b"/assets/web/atlas-home.html" not in data: raise SystemExit("Compiled DEX does not reference chooser start route")
          print("Release APK ZIP, routes, France AI guard and territory assets verified")
          PY
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          BADGING="$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='uk.megalith.lidar' versionCode='321' versionName='3.3.0'" <<< "$BADGING" || { echo "APK packageId/version metadata mismatch"; exit 1; }

      - name: Upload unsigned release candidate (non-publishing)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: megalith-lidar-release-candidate-${{ inputs.tag || 'v3.3.0' }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record build provenance
        run: |
          echo "Source SHA: ${{ steps.identity.outputs.source_sha }}" >> "$GITHUB_STEP_SUMMARY"
          case "${{ inputs.mode || 'build-only' }}" in
            build-only)
              echo "Unsigned non-publishing candidate only: no signing, no tag creation, no GitHub Release." >> "$GITHUB_STEP_SUMMARY"
              ;;
            signed-test)
              echo "A separate job will produce a historically signed installable APK artifact; no tag or public GitHub Release will be created." >> "$GITHUB_STEP_SUMMARY"
              ;;
            publish)
              echo "A separate job will sign and verify the APK; public tag/Release creation requires explicit authorization." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Unknown release mode"; exit 1
              ;;
          esac

  publish-release:
    name: Sign an installable APK and optionally publish the Android release
    needs: build-release-candidate
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed-test' || inputs.mode == 'publish') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v3.3.0' }}
      SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
      SOURCE_SHA: ${{ needs.build-release-candidate.outputs.source_sha }}
      EXPECTED_CERT_SHA256: ${{ needs.build-release-candidate.outputs.historical_cert_sha256 }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-release-candidate.outputs.source_sha }}
          fetch-depth: 0

      - name: Verify signing prerequisites and public-release authorization
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "publish" ]]; then
            [[ "${{ inputs.confirm_publication }}" == "PUBLISH_PUBLIC_RELEASE" ]] || { echo "Publication not explicitly authorized"; exit 1; }
          fi
          [[ "$EXPECTED_CERT_SHA256" =~ ^[A-F0-9]{64}$ ]] || { echo "Historical certificate fingerprint was not established by upstream APK verification"; exit 1; }
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Required signing secret is absent: $name (or its RELEASE_ fallback)"; exit 1; }
          done
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo "Checked-out commit does not match the validated build SHA"; exit 1; }
          REMOTE_BRANCH_SHA="$(git ls-remote origin "refs/heads/${SOURCE_REF}" | cut -f1)"
          [[ "$REMOTE_BRANCH_SHA" == "$SOURCE_SHA" ]] || { echo "Source branch moved since candidate build; refusing signing/publication"; exit 1; }
          if [[ "${{ inputs.mode }}" == "publish" ]]; then
            set +e
            REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" 2>&1)"
            TAG_STATUS=$?
            set -e
            if [[ "$TAG_STATUS" -ne 0 ]]; then echo "Could not establish tag availability (git ls-remote exit $TAG_STATUS)"; exit 1; fi
            if [[ -n "$REMOTE_TAGS" ]]; then echo "Release tag already exists; refusing to replace it"; exit 1; fi
          fi
          echo "Signing gates accepted for source $SOURCE_SHA and tag $RELEASE_TAG (mode: ${{ inputs.mode }})"

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android Build-Tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Download the exact unsigned candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: megalith-lidar-release-candidate-${{ inputs.tag }}
          path: release-input/

      - name: Sign APK and verify historical certificate identity
        id: signing
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          UNSIGNED_APK="release-input/app-release-unsigned.apk"
          SIGNED_APK="release/megalith-lidar-${RELEASE_TAG}.apk"
          test -s "$UNSIGNED_APK"
          mkdir -p release
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/megalith-lidar-release.jks"
          test -s "$RUNNER_TEMP/megalith-lidar-release.jks"
          "${BUILD_TOOLS}/zipalign" -f 4 "$UNSIGNED_APK" "$RUNNER_TEMP/megalith-lidar-aligned.apk"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$RUNNER_TEMP/megalith-lidar-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --alignment-preserved \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$RUNNER_TEMP/megalith-lidar-aligned.apk"
          rm -f "$RUNNER_TEMP/megalith-lidar-release.jks"
          VERIFY_OUTPUT="$("${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$SIGNED_APK" 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true'
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -nE 's/.*Signer #1 certificate SHA-256 digest: ([A-Fa-f0-9:]+).*/\1/p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ "$ACTUAL_CERT" =~ ^[A-F0-9]{64}$ ]] || { echo "Could not extract the APK signing certificate fingerprint"; exit 1; }
          [[ "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || { echo "Signing certificate does not match the historical certificate fingerprint"; exit 1; }
          "${BUILD_TOOLS}/zipalign" -c -v 4 "$SIGNED_APK"
          "${BUILD_TOOLS}/apksigner" verify --verbose "$SIGNED_APK"
          sha256sum "$SIGNED_APK" | tee "$SIGNED_APK.sha256"
          (cd release && sha256sum "$(basename "$SIGNED_APK")" > SHA256SUMS)
          echo "certificate_sha256=$ACTUAL_CERT" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(sha256sum "$SIGNED_APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest signed APK provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.apk

      - name: Upload signed installable APK for controlled testing
        if: ${{ inputs.mode == 'signed-test' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: megalith-lidar-signed-test-${{ inputs.tag }}
          path: |
            release/megalith-lidar-${{ inputs.tag }}.apk
            release/megalith-lidar-${{ inputs.tag }}.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish the exact validated commit as a public GitHub Release
        if: ${{ inputs.mode == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="release/megalith-lidar-${RELEASE_TAG}.apk"
          NOTES="fastlane/metadata/android/en-US/changelogs/321.txt"
          test -s "$APK" && test -s "$NOTES"
          REMOTE_BRANCH_SHA="$(git ls-remote origin "refs/heads/${SOURCE_REF}" | cut -f1)"
          [[ "$REMOTE_BRANCH_SHA" == "$SOURCE_SHA" ]] || { echo "Source branch moved before publication"; exit 1; }
          # Create the tag on the exact source commit before publishing; never force-update an existing tag.
          git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "Megalith LiDAR ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          [[ "$REMOTE_TAG_SHA" == "$(git rev-parse "refs/tags/${RELEASE_TAG}")" ]] || { echo "Remote tag object differs from the created tag"; exit 1; }
          TAG_COMMIT_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$TAG_COMMIT_SHA" == "$SOURCE_SHA" ]] || { echo "Tag does not point to the validated source commit"; exit 1; }
          gh release create "$RELEASE_TAG" "$APK" "$APK.sha256" "release/SHA256SUMS" \
            --title "Megalith LiDAR ${RELEASE_TAG}" \
            --notes-file "$NOTES"
          echo "Public release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Android version: 3.3.0 (321)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256: ${{ steps.signing.outputs.apk_sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing certificate SHA-256: ${{ steps.signing.outputs.certificate_sha256 }}" >> "$GITHUB_STEP_SUMMARY"
