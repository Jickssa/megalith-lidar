name: Validate Monolith France module

on:
  pull_request:
    paths:
      - "integrations/monolith-france/**"
      - ".github/workflows/validate-monolith-france.yml"
  push:
    branches:
      - "feature/monolith-france-1.1.0"
    paths:
      - "integrations/monolith-france/**"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate module package
        run: python integrations/monolith-france/scripts/validate_package.py
      - name: Check JavaScript syntax
        run: node --check integrations/monolith-france/web/app.js
      - name: Compile Python scripts
        run: python -m py_compile integrations/monolith-france/scripts/*.py integrations/monolith-france/tests/*.py
      - name: Test Android project installer in temporary fixture
        run: python integrations/monolith-france/tests/test_android_installer.py
